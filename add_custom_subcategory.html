{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Custom SubCategory</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/admin_styles.css' %}">
    <!-- Feather Icons -->
    <link rel="stylesheet" href="https://unpkg.com/feather-icons/dist/feather.css">
    <style>
        /* Custom styles for the form */
        .form-container {
            max-width: 500px; /* Reduced width */
            margin: 50px auto; /* Center the form vertically and horizontally */
            padding: 20px;
            border: 1px solid #ccc; /* Frame */
            border-radius: 10px; /* Rounded corners for the frame */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Slight shadow for a better effect */
            background-color: #f9f9f9; /* Light background color inside the frame */
        }
        .form-container h2 {
            text-align: center; /* Center the heading */
            margin-bottom: 20px;
        }
        .form-group label {
            font-weight: bold; /* Make labels bold */
        }
        
            .feather {
                width: 16px;
                height: 16px;
            }
       
    </style>
</head>
<body>
    <nav class="navbar navbar-dark sticky-top" style="background-color: #f1ddcf;">
        <a class="navbar-brand col-md-3 col-lg-2 mr-0 d-flex align-items-center" href="#">
            <img src="{% static 'img/home/log10.png' %}" width="180" height="50" class="d-inline-block align-middle" alt="" style="background-color: #f1ddcf; margin-top: 50px; position: fixed;">
        </a>
        <ul class="navbar-nav px-3 ml-auto" style="background-color: #f1ddcf; margin-top: 15px; margin-left: 20px;">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="color: black;">
                    Welcome, {{ user.username }}!
                </a>
                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
                    <a class="dropdown-item" href=""><i data-feather="user"></i> Profile</a>
                    <a class="dropdown-item" href=""><i data-feather="key"></i> Change Password</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" href="{% url 'logout' %}"><i data-feather="log-out"></i> Logout</a>
                </div>
            </li>
        </ul>
    </nav>
    
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block bg-salmon sidebar">
                <div class="sidebar-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active mt-3" href="{% url 'seller_dashboard' %}">
                                <i data-feather="home"></i>
                                Dashboard <span class="sr-only">(current)</span>
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link mt-3" href="{% url 'seller_view_categories' %}">
                                <i data-feather="layers"></i>
                                Categories
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link mt-3" href="{% url 'seller_view_subcategories' %}">
                                <i data-feather="shopping-cart"></i>
                                SubCategories
                            </a>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link mt-3" href="{% url 'view_product' %}">
                                <i data-feather="package"></i>
                                Products
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link mt-3" href="{% url 'view_custom_categories'%}">
                                <i data-feather="layers"></i>
                                Custom Category
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link mt-3" href="{% url 'view_custom_subcategories' %}">
                                <i data-feather="shopping-cart"></i>
                                Custom SubCategories
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link mt-3" href="#">
                                <i data-feather="mail"></i>
                                Contact Us
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link mt-3" href="{% url 'logout' %}">
                                <i data-feather="log-out"></i>
                                Logout
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
    
            <div class="col-md-9 ml-sm-auto col-lg-10 px-4">
                <div class="form-container">
                    <h2>Add Custom SubCategory</h2>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="category">Select Category:</label>
                            <select id="category" name="category" class="form-control" required>
                                {% for category in categories %}
                                    <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="sub_name">SubCategory Name:</label>
                            <input type="text" id="sub_name" name="sub_name" class="form-control" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block">Add SubCategory</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        feather.replace()
    </script>
</body>
</html>
